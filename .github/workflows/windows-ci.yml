name: Windows CI

on:
  push:
    branches:
      - main
      - work/full-app-stabilization-2026-11-18
      - reduce-2-upgrade
  pull_request:
    branches: [main, reduce-2-upgrade]
  workflow_dispatch:

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify repository file index
        shell: pwsh
        run: |
          python tools/gen_index.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- docs/FILE_INDEX.md

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore tests and application
        run: dotnet restore build/ShouTech.sln

      - name: Verify default root project build
        run: dotnet build

      - name: Build full solution and tests
        run: dotnet build build/ShouTech.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test tests/Kern.Tests/Kern.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=tests.trx"

      - name: Report failed tests
        if: failure()
        shell: pwsh
        run: |
          $trx = Get-ChildItem -Path . -Recurse -Filter *.trx -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $trx) { Write-Host "::error::No trx test results found"; exit 0 }
          [xml]$x = Get-Content -Raw $trx.FullName
          $ns = @{ t = 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010' }
          $failed = Select-Xml -Xml $x -XPath "//t:UnitTestResult[@outcome='Failed']" -Namespace $ns
          foreach ($item in $failed) {
            $n = $item.Node
            $name = [string]$n.GetAttribute('testName')
            $manager = New-Object System.Xml.XmlNamespaceManager($n.OwnerDocument.NameTable)
            $manager.AddNamespace('t', 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010')
            $messageNode = $n.SelectSingleNode("t:Output/t:ErrorInfo/t:Message", $manager)
            $stackNode = $n.SelectSingleNode("t:Output/t:ErrorInfo/t:StackTrace", $manager)
            Write-Host "::error title=Failed test::$name"
            if ($messageNode) { Write-Host $messageNode.InnerText }
            if ($stackNode) { Write-Host $stackNode.InnerText }
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: warn
