name: Windows CI

on:
  push:
    branches:
      - main
      - work/full-app-stabilization-2026-11-18
      - reduce-2-upgrade
  pull_request:
    branches: [main, reduce-2-upgrade]
  workflow_dispatch:

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ShouTech.ERP.Com
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore tests and application
        run: dotnet restore tests/Kern.Tests/Kern.Tests.csproj

      - name: Build application and tests
        run: dotnet build tests/Kern.Tests/Kern.Tests.csproj --configuration Release --no-restore

      - name: Run tests
        run: dotnet test tests/Kern.Tests/Kern.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=tests.trx"

      - name: Report failed tests
        if: failure()
        shell: pwsh
        run: |
          $trx = Get-ChildItem -Path . -Recurse -Filter *.trx -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $trx) { Write-Host "::error::No trx test results found"; exit 0 }
          [xml]$x = Get-Content $trx.FullName
          $ns = @{ t = 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010' }
          Select-Xml -Xml $x -XPath "//t:UnitTestResult[@outcome='Failed']" -Namespace $ns | ForEach-Object {
            $n = $_.Node
            $nm = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($n.testName))
            $msg = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes(($n.'Message'.'#text' + ' ' + $n.InnerXml)))
            $st  = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($n.'StackTrace'.'#text'))
            for ($i = 0; $i -lt $nm.Length; $i += 400) { Write-Host ("::error::B64NAME {0}" -f $nm.Substring($i, [Math]::Min(400, $nm.Length - $i))) }
            for ($i = 0; $i -lt $msg.Length; $i += 400) { Write-Host ("::error::B64MSG {0}" -f $msg.Substring($i, [Math]::Min(400, $msg.Length - $i))) }
            for ($i = 0; $i -lt $st.Length; $i += 400) { Write-Host ("::error::B64ST {0}" -f $st.Substring($i, [Math]::Min(400, $st.Length - $i))) }
            Write-Host "::error::B64END"
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-test-results
          path: ShouTech.ERP.Com/**/TestResults/*.trx
          if-no-files-found: warn
