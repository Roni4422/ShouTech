name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ShouTech.ERP.Com
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore tests and application
        run: dotnet restore tests/Kern.Tests/Kern.Tests.csproj

      - name: Build application and tests
        run: dotnet build tests/Kern.Tests/Kern.Tests.csproj --configuration Release --no-restore

      - name: Run tests
        run: dotnet test tests/Kern.Tests/Kern.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=tests.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: windows-test-results
          path: ShouTech.ERP.Com/**/TestResults/*.trx
          if-no-files-found: warn
