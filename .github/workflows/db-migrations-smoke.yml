name: Database migration smoke tests

on:
  push:
    branches: [main, work/full-app-stabilization-2026-11-18, reduce-2-upgrade]
    paths:
      - 'dba/mig/**'
      - 'tools/SqlMigrator/**'
      - 'app/Services/SchMig.cs'
      - 'app/Views/MaintWin.cs'
      - 'src/Infra/OperationsRepository.cs'
      - 'src/Infra/MigrationBundleReader.cs'
      - 'tools/bundle_migrations.py'
      - 'src/Dom/Interfaces/IOperationsRepository.cs'
      - 'tests/Kern.Tests/OperationsServiceTests.cs'
      - 'tests/Kern.Tests/Kern.Tests.csproj'
      - 'ShouTech.ERP.csproj'
      - '.github/workflows/db-migrations-smoke.yml'
  pull_request:
    branches: [main, reduce-2-upgrade]
    paths:
      - 'dba/mig/**'
      - 'tools/SqlMigrator/**'
      - 'app/Services/SchMig.cs'
      - 'app/Views/MaintWin.cs'
      - 'src/Infra/OperationsRepository.cs'
      - 'src/Infra/MigrationBundleReader.cs'
      - 'tools/bundle_migrations.py'
      - 'src/Dom/Interfaces/IOperationsRepository.cs'
      - 'tests/Kern.Tests/OperationsServiceTests.cs'
      - 'tests/Kern.Tests/Kern.Tests.csproj'
      - 'ShouTech.ERP.csproj'
      - '.github/workflows/db-migrations-smoke.yml'
  workflow_dispatch:

concurrency:
  group: db-migrations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sqlite-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify migration classification and bundle checksums
        if: github.event_name != 'push' || github.ref_name != 'reduce-2-upgrade' || !contains(github.event.head_commit.message, '[bundle-migrations]')
        run: python3 tools/bundle_migrations.py verify
      - name: Generate compact migration bundles for this consolidation
        if: github.event_name == 'push' && github.ref_name == 'reduce-2-upgrade' && contains(github.event.head_commit.message, '[bundle-migrations]')
        run: |
          git fetch origin reduce
          git checkout origin/reduce -- dba/mig/sqlite dba/mig/postgresql
          python3 tools/bundle_migrations.py apply
      - name: Regenerate file index for migration bundles
        if: github.event_name == 'push' && github.ref_name == 'reduce-2-upgrade' && contains(github.event.head_commit.message, '[bundle-migrations]')
        run: python3 tools/gen_index.py
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Create clean SQLite database and apply migrations
        run: dotnet run --project tools/SqlMigrator/SqlMigrator.csproj -- --provider sqlite --connection "Data Source=$RUNNER_TEMP/shoutech-fresh.db"
      - name: Re-run migrations against the same SQLite database
        run: dotnet run --project tools/SqlMigrator/SqlMigrator.csproj -- --provider sqlite --connection "Data Source=$RUNNER_TEMP/shoutech-fresh.db"
      - name: Assert journal header columns exist in SQLite
        run: |
          python3 - <<'PY'
          import sqlite3, os
          path = os.path.join(os.environ["RUNNER_TEMP"], "shoutech-fresh.db")
          with sqlite3.connect(path) as con:
              columns = {row[1] for row in con.execute("PRAGMA table_info(journal_entries)")}
              indexes = {row[1] for row in con.execute("PRAGMA index_list('journal_entries')")}
          required = {"reference_number", "currency_code", "exchange_rate", "document_number", "fiscal_period_id"}
          missing = sorted(required - columns)
          if missing:
              raise SystemExit(f"SQLite journal_entries is missing columns: {missing}")
          if "ux_journal_entries_company_period_document_number" not in indexes:
              raise SystemExit("SQLite journal document-number uniqueness index is missing")
          group_table = con.execute("SELECT count(*) FROM sqlite_master WHERE type='table' AND name='material_group_items'").fetchone()[0]
          if group_table != 1:
              raise SystemExit("SQLite material_group_items table is missing")
          group_indexes = {row[1] for row in con.execute("PRAGMA index_list('material_group_items')")}
          if "ix_material_group_items_material" not in group_indexes:
              raise SystemExit("SQLite material-group membership index is missing")
          group_foreign_keys = list(con.execute("PRAGMA foreign_key_list('material_group_items')"))
          if len(group_foreign_keys) != 4:
              raise SystemExit(f"Expected two company-scoped composite foreign keys, found {len(group_foreign_keys)} rows")
          return_table = con.execute("SELECT count(*) FROM sqlite_master WHERE type='table' AND name='purchase_return_line_allocations'").fetchone()[0]
          if return_table != 1:
              raise SystemExit("SQLite purchase-return line allocation table is missing")
          return_columns = {row[1] for row in con.execute("PRAGMA table_info(purchase_return_line_allocations)")}
          required_return = {"allocation_id", "company_id", "return_doc_id", "return_line_id", "original_doc_id", "original_line_id", "material_id", "returned_qty", "created_by", "created_at"}
          missing_return = sorted(required_return - return_columns)
          if missing_return:
              raise SystemExit(f"SQLite purchase-return allocation table is missing columns: {missing_return}")
          receipt_return_table = con.execute("SELECT count(*) FROM sqlite_master WHERE type='table' AND name='purchase_receipt_return_line_allocations'").fetchone()[0]
          if receipt_return_table != 1:
              raise SystemExit("SQLite pre-invoice receipt-return allocation table is missing")
          receipt_return_columns = {row[1] for row in con.execute("PRAGMA table_info(purchase_receipt_return_line_allocations)")}
          required_receipt_return = {"allocation_id", "company_id", "return_doc_id", "return_line_id", "original_doc_id", "original_line_id", "material_id", "returned_qty", "created_by", "created_at"}
          missing_receipt_return = sorted(required_receipt_return - receipt_return_columns)
          if missing_receipt_return:
              raise SystemExit(f"SQLite pre-invoice receipt-return table is missing columns: {missing_receipt_return}")
          print("SQLite journal, material-group membership, invoice-return, and pre-invoice receipt-return schemas verified.")
          PY
      - name: Test existing SQLite migration-history table
        run: |
          python3 - <<'PY'
          import sqlite3, os, re
          from pathlib import Path
          path = os.path.join(os.environ["RUNNER_TEMP"], "shoutech-existing-history.db")
          match = re.search(rb"(?m)^-- @shoutech-migration 000_history\.sql ([0-9A-Fa-f]{64}) ([0-9A-Fa-f]{64}) ([0-9A-Fa-f]{64}) ", Path("dba/mig/sqlite/sys.sql").read_bytes())
          if not match:
              raise SystemExit("SQLite history migration marker was not found")
          con = sqlite3.connect(path)
          con.execute("""CREATE TABLE schema_migrations (
              migration_id TEXT PRIMARY KEY,
              checksum TEXT NOT NULL,
              applied_at TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP
          )""")
          con.execute("INSERT INTO schema_migrations (migration_id, checksum) VALUES (?, ?)", ("000_history.sql", match.group(2).decode("ascii")))
          con.commit()
          con.close()
          PY
          output=$(dotnet run --project tools/SqlMigrator/SqlMigrator.csproj -- --provider sqlite --connection "Data Source=$RUNNER_TEMP/shoutech-existing-history.db" 2>&1)
          echo "$output"
          echo "$output" | grep -q "SKIP 000_history.sql"
          dotnet run --project tools/SqlMigrator/SqlMigrator.csproj -- --provider sqlite --connection "Data Source=$RUNNER_TEMP/shoutech-existing-history.db"

      - name: Upload validated migration bundles
        if: success() && github.event_name == 'push' && github.ref_name == 'reduce-2-upgrade' && contains(github.event.head_commit.message, '[bundle-migrations]')
        uses: actions/upload-artifact@v6
        with:
          name: validated-migration-bundles
          path: |
            dba/mig/
            docs/FILE_INDEX.md
          if-no-files-found: error

  postgresql-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: shoutest
          POSTGRES_PASSWORD: shoutest
          POSTGRES_DB: shoutest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shoutest -d shoutest"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - name: Verify migration classification and bundle checksums
        run: python3 tools/bundle_migrations.py verify
      - name: Generate compact migration bundles for this consolidation
        if: github.event_name == 'push' && github.ref_name == 'reduce-2-upgrade' && contains(github.event.head_commit.message, '[bundle-migrations]')
        run: python3 tools/bundle_migrations.py apply
      - name: Regenerate file index for migration bundles
        if: github.event_name == 'push' && github.ref_name == 'reduce-2-upgrade' && contains(github.event.head_commit.message, '[bundle-migrations]')
        run: python3 tools/gen_index.py
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Apply migrations to clean PostgreSQL database
        env:
          PG_CONN: Host=localhost;Port=5432;Database=shoutest;Username=shoutest;Password=shoutest
        run: dotnet run --project tools/SqlMigrator/SqlMigrator.csproj -- --provider postgresql --connection "$PG_CONN"
      - name: Re-run migrations against the same PostgreSQL database
        env:
          PG_CONN: Host=localhost;Port=5432;Database=shoutest;Username=shoutest;Password=shoutest
        run: dotnet run --project tools/SqlMigrator/SqlMigrator.csproj -- --provider postgresql --connection "$PG_CONN"
      - name: Assert journal header columns exist in PostgreSQL
        env:
          PG_CONN: Host=localhost;Port=5432;Database=shoutest;Username=shoutest;Password=shoutest
          PGPASSWORD: shoutest
        run: |
          count=$(psql -h localhost -U shoutest -d shoutest -Atc "SELECT count(*) FROM information_schema.columns WHERE table_schema='public' AND table_name='journal_entries' AND column_name IN ('reference_number','currency_code','exchange_rate','document_number','fiscal_period_id')")
          test "$count" = "5" || { echo "Expected five journal header columns, found $count"; exit 1; }
          index_count=$(psql -h localhost -U shoutest -d shoutest -Atc "SELECT count(*) FROM pg_indexes WHERE schemaname='public' AND tablename='journal_entries' AND indexname='ux_journal_entries_company_period_document_number'")
          test "$index_count" = "1" || { echo "PostgreSQL journal document-number uniqueness index is missing"; exit 1; }
          group_table_count=$(psql -h localhost -U shoutest -d shoutest -Atc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_name='material_group_items'")
          test "$group_table_count" = "1" || { echo "PostgreSQL material_group_items table is missing"; exit 1; }
          group_index_count=$(psql -h localhost -U shoutest -d shoutest -Atc "SELECT count(*) FROM pg_indexes WHERE schemaname='public' AND tablename='material_group_items' AND indexname='ix_material_group_items_material'")
          test "$group_index_count" = "1" || { echo "PostgreSQL material-group membership index is missing"; exit 1; }
          group_fk_count=$(psql -h localhost -U shoutest -d shoutest -Atc "SELECT count(*) FROM information_schema.table_constraints WHERE table_schema='public' AND table_name='material_group_items' AND constraint_type='FOREIGN KEY'")
          test "$group_fk_count" = "2" || { echo "Expected two company-scoped material-group foreign keys, found $group_fk_count"; exit 1; }
          return_table_count=$(psql -h localhost -U shoutest -d shoutest -Atc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_name='purchase_return_line_allocations'")
          test "$return_table_count" = "1" || { echo "PostgreSQL purchase_return_line_allocations table is missing"; exit 1; }
          return_column_count=$(psql -h localhost -U shoutest -d shoutest -Atc "SELECT count(*) FROM information_schema.columns WHERE table_schema='public' AND table_name='purchase_return_line_allocations' AND column_name IN ('allocation_id','company_id','return_doc_id','return_line_id','original_doc_id','original_line_id','material_id','returned_qty','created_by','created_at')")
          test "$return_column_count" = "10" || { echo "PostgreSQL purchase-return lineage columns are incomplete"; exit 1; }
          receipt_return_table_count=$(psql -h localhost -U shoutest -d shoutest -Atc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_name='purchase_receipt_return_line_allocations'")
          test "$receipt_return_table_count" = "1" || { echo "PostgreSQL pre-invoice receipt-return allocation table is missing"; exit 1; }
          receipt_return_column_count=$(psql -h localhost -U shoutest -d shoutest -Atc "SELECT count(*) FROM information_schema.columns WHERE table_schema='public' AND table_name='purchase_receipt_return_line_allocations' AND column_name IN ('allocation_id','company_id','return_doc_id','return_line_id','original_doc_id','original_line_id','material_id','returned_qty','created_by','created_at')")
          test "$receipt_return_column_count" = "10" || { echo "PostgreSQL pre-invoice receipt-return lineage columns are incomplete"; exit 1; }
          echo "PostgreSQL journal, material-group membership, invoice-return, and pre-invoice receipt-return schemas verified."
      - name: Test existing PostgreSQL migration-history table
        env:
          PG_CONN_HISTORY: Host=localhost;Port=5432;Database=shoutest_existing_history;Username=shoutest;Password=shoutest
        run: |
          # Use a separate empty database: dropping public alone may leave application objects in other schemas.
          PGPASSWORD=shoutest createdb -h localhost -U shoutest shoutest_existing_history
          PGPASSWORD=shoutest psql -h localhost -U shoutest -d shoutest_existing_history -v ON_ERROR_STOP=1 -c "CREATE TABLE schema_migrations (migration_id text PRIMARY KEY, checksum char(64) NOT NULL, applied_at timestamptz NOT NULL DEFAULT now());"
          history_hash=$(python3 - <<'PY'
          import re
          from pathlib import Path
          match = re.search(rb"(?m)^-- @shoutech-migration 000_history\.sql ([0-9A-Fa-f]{64}) ([0-9A-Fa-f]{64}) ([0-9A-Fa-f]{64}) ", Path("dba/mig/postgresql/sys.sql").read_bytes())
          if not match:
              raise SystemExit("PostgreSQL history migration marker was not found")
          print(match.group(1).decode("ascii"))
          PY
          )
          PGPASSWORD=shoutest psql -h localhost -U shoutest -d shoutest_existing_history -v ON_ERROR_STOP=1 -c "INSERT INTO schema_migrations (migration_id, checksum) VALUES ('000_history.sql', '$history_hash');"
          output=$(dotnet run --project tools/SqlMigrator/SqlMigrator.csproj -- --provider postgresql --connection "$PG_CONN_HISTORY" 2>&1)
          echo "$output"
          echo "$output" | grep -q "SKIP 000_history.sql"
          dotnet run --project tools/SqlMigrator/SqlMigrator.csproj -- --provider postgresql --connection "$PG_CONN_HISTORY"
      - name: Run PostgreSQL maintenance integration checks
        env:
          SHOUTECH_TEST_POSTGRES: Host=localhost;Port=5432;Database=shoutest;Username=shoutest;Password=shoutest
        run: dotnet test tests/Kern.Tests/Kern.Tests.csproj --configuration Release -p:DatabaseOnly=true --filter FullyQualifiedName~Maintenance_PostgreSql_ChecksAndVacuumAnalyze

  commit-migration-bundles:
    if: github.event_name == 'push' && github.ref_name == 'reduce-2-upgrade' && contains(github.event.head_commit.message, '[bundle-migrations]')
    needs: [sqlite-migrations, postgresql-migrations]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Build and verify compact migration bundles
        run: |
          git fetch origin reduce
          git checkout origin/reduce -- dba/mig/sqlite dba/mig/postgresql
          python3 tools/bundle_migrations.py apply
          python3 tools/bundle_migrations.py verify
          python3 tools/gen_index.py
      - name: Commit consolidated migrations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dba/mig docs/FILE_INDEX.md
          git diff --cached --quiet && exit 0
          git commit -m "Consolidate SQL migrations into functional bundles"
          git push origin "HEAD:${GITHUB_REF_NAME}"
